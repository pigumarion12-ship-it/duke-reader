<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102033">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>補足講座の書き起こし | DUKE 聴く読書室</title>
  <meta name="description" content="補足講座の保存字幕を、元動画の時刻とともに読むページです。">
  <link rel="stylesheet" href="transcripts.css">
  <script src="transcripts.js" defer></script>
</head>
<body>
  <a id="skip-to-reading" class="skip-link" href="#reading">本文へ移動</a>
  <main class="page">
    <header class="site-header">
      <a class="brand" href="index.html">DUKE <span>聴く読書室</span></a>
      <a class="back-link" href="index.html">音声読書室に戻る</a>
    </header>

    <section class="introduction" aria-labelledby="page-title">
      <h1 id="page-title">補足講座の書き起こし</h1>
      <p>補足41講座のうち40講座の書き起こしを読めます。保存字幕を掲載しています。誤字や聞き取り違い、字幕が抜けた区間があり、原音との全編照合は未完了です。内容は講座当時のものです。</p>
    </section>

    <div class="reading-layout">
      <aside class="catalog-panel" aria-label="講座一覧">
        <details id="catalog" open>
          <summary>講座を選ぶ <span id="catalog-count">全41講座</span></summary>
          <div class="catalog-content">
            <label for="lecture-search">タイトルで絞り込む</label>
            <input id="lecture-search" type="search" placeholder="講座名を入力" autocomplete="off" disabled>
            <p id="search-result" class="search-result" role="status" aria-live="polite">講座を読み込んでいます。</p>
            <nav id="lecture-list" class="lecture-list" aria-label="読む講座"></nav>
            <div id="empty-search" class="empty-search" hidden>
              <p>該当する講座がありません。別の言葉で検索してください。</p>
              <button id="clear-search" type="button">絞り込みを解除</button>
            </div>
          </div>
        </details>
      </aside>

      <article id="reading" class="reading" aria-labelledby="lecture-title" aria-busy="true" tabindex="-1">
        <header class="reading-header">
          <p id="lecture-meta" class="lecture-meta">保存字幕</p>
          <h2 id="lecture-title" tabindex="-1">講座を読み込んでいます</h2>
          <a id="source-link" class="source-link" target="_blank" rel="noopener noreferrer" hidden>元の講座を開く（別タブ）</a>
        </header>
        <p id="lecture-status" class="lecture-status" role="status" aria-live="polite"></p>
        <div id="load-error" class="message" hidden>
          <p>講座を読み込めませんでした。通信状態を確認して、もう一度お試しください。</p>
          <button id="retry" type="button">もう一度読み込む</button>
        </div>
        <nav id="paging-top" class="lecture-paging" aria-label="前後の講座" hidden></nav>
        <div id="transcript" class="transcript"></div>
        <nav id="paging-bottom" class="lecture-paging bottom-paging" aria-label="読み終えた後の講座選択" hidden></nav>
      </article>
    </div>
    <noscript><p class="message">書き起こしを読むには、ブラウザーのJavaScriptを有効にしてください。</p></noscript>
    <footer class="page-footer">個人学習用 · 新高値ブレイク投資法</footer>
  </main>
</body>
</html>
